name: TERRAFORM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          for dir in $(find . -type f -name "*.tf" | xargs -n1 dirname | sort -u)
          do
            (cd "$dir" && terraform init -backend=false)
          done

      - name: Terraform Validate
        run: |
          for dir in $(find . -type f -name "*.tf" | xargs -n1 dirname | sort -u)
          do
            (cd "$dir" && terraform validate)
          done

      - name: Terraform Plan
        run: |
          for dir in $(find . -type f -name "*.tf" | xargs -n1 dirname | sort -u)
          do
            (cd "$dir" && terraform plan)
          done